[package]
name = "zklash"
cairo-version = "=2.7.0"
version = "0.1.0"
edition = "2023_10"

[cairo]
sierra-replace-ids = true

[scripts]
dev = "sozo --profile dev clean && sozo --profile dev build && sozo --profile dev migrate plan && sozo --profile dev migrate apply"
slot = "NAME=v0 && sozo --profile slot clean && sozo --profile slot build && sozo --profile slot migrate plan --name $NAME && sozo --profile slot migrate apply --name $NAME"
slotdev = "NAME=v0 && sozo --profile slotdev clean && sozo --profile slotdev build && sozo --profile slotdev migrate plan --name $NAME && sozo --profile slotdev migrate apply --name $NAME"

[dependencies]
origami_rating = { git = "https://github.com/dojoengine/origami", tag = "v1.0.0-alpha.5" }
dojo = { git = "https://github.com/dojoengine/dojo", tag = "v1.0.0-alpha.5" }

[[target.dojo]]